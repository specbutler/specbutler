# Spec Butler configuration
# Place this file as `.spec.toml` in your repo root.

# Git ref used as the base for new implementation branches.
# The orchestrator creates branches from this ref and targets PRs at the
# branch name after the last '/'.
base_ref = "origin/main"

# ---------------------------------------------------------------------------
# Paths (all relative to repo root)
# ---------------------------------------------------------------------------
[paths]

# Directory containing spec markdown files.
specs_dir = "specs"

# Directory for lightweight task specs (created by `spec task`).
task_specs_dir = "specs/tasks"

# Directory for orchestrator run state (run records, intake answers, etc.).
# Add this to .gitignore.
state_dir = ".spec-state"

# Directory for git worktrees used during implementation.
# Add this to .gitignore.
worktrees_dir = ".worktrees"

# ---------------------------------------------------------------------------
# Retry behavior
# ---------------------------------------------------------------------------
[retry]

# Maximum number of retries across verify failures, review change requests,
# and merge conflicts before the orchestrator gives up and creates a draft PR.
cap = 20

# Number of consecutive retries with no new commits before the orchestrator
# stops retrying the implement phase (prevents infinite loops when the agent
# makes no progress).
no_progress_retry_threshold = 2

# Infrastructure failures (container image build or service startup, missing
# toolchain, expired credentials, provider usage limits, push/PR-create
# failures, CI or auto-merge wait timeouts) never consume `cap`. A transient
# one reruns the same phase in place after a jittered exponential backoff
# (base * 2^(n-1), capped at max), at most `infra_retry_attempts` times per
# run and failure signature; then the run fails and autopilot takes over.
infra_retry_attempts = 2
infra_backoff_base_seconds = 30
infra_backoff_max_seconds = 600

# ---------------------------------------------------------------------------
# Autopilot infrastructure backoff and circuit breaker
# ---------------------------------------------------------------------------
[autopilot]

# After an infrastructure failure, `spec auto run` waits a jittered
# exponential backoff per spec and failure signature before relaunching.
infra_backoff_base_seconds = 60
infra_backoff_max_seconds = 1800

# After this many consecutive infrastructure failures with the same signature
# on this repo's backend, the breaker opens: affected work is held as
# blocked-on-infrastructure, the notifiers fire once, and a single probe
# dispatch is allowed per cooldown. A success or a code failure closes it;
# `spec auto run --reset-infra-breaker` clears it after a manual fix.
infra_breaker_threshold = 3
infra_breaker_cooldown_seconds = 1800

# ---------------------------------------------------------------------------
# Agent configuration
# ---------------------------------------------------------------------------
[agents]

# Default agent to use when --agent is not specified.
default = "claude"

# Default agent for independent review. It must also appear in `allowed`.
review_default = "codex"

# Agents allowed for implementation. The CLI will reject unknown agent names.
allowed = ["claude", "codex"]

# ---------------------------------------------------------------------------
# Bootstrap
# ---------------------------------------------------------------------------
[bootstrap]

# Command to install dependencies in a fresh worktree. Runs once during the
# bootstrap phase before the agent starts implementing. Leave empty (or omit)
# if your project doesn't need a separate install step.
#
# Examples:
#   install_command = "python -m venv .venv && .venv/bin/python -m pip install -e '.[dev]'"
#   install_command = "npm ci"
#   install_command = "make install"
install_command = "python -m venv .venv && .venv/bin/python -m pip install -e '.[dev]'"

# Optional container image cache optimization. The normal install_command above
# runs in the full workspace and is the compatibility path. This cache command
# runs earlier during container image build against dependency inputs only.
#
# [bootstrap.cache]
# enabled = false
# command = "python -m pip install -r requirements.txt"
# inputs = ["requirements.txt"]

# ---------------------------------------------------------------------------
# Verify gates
# ---------------------------------------------------------------------------
# Each gate runs a command during the verify phase. Gates with parallel = true
# run concurrently; sequential gates (parallel = false) run after all parallel
# gates complete.
#
# The `role` field is optional — it gives the gate a semantic role ("test",
# "lint", "e2e") used for diagnostics. Defaults to the gate name.
# `review_evidence` is an optional exact allowlist of UTF-8 receipt files that
# the gate writes inside its execution workspace. Passing gates bind each file
# to the verified commit and include a bounded, redacted copy in built-in review.
# Generated receipt paths should be gitignored so gates leave the worktree clean.

[verify]

[[verify.gates]]
name = "test"
command = ".venv/bin/python -m pytest"
parallel = true

[[verify.gates]]
name = "lint"
command = ".venv/bin/python -m ruff check ."
parallel = true

# Example: an end-to-end gate that must run sequentially
# [[verify.gates]]
# name = "e2e"
# command = "playwright test"
# parallel = false
# review_evidence = ["artifacts/native-test-receipt.json"]

# ---------------------------------------------------------------------------
# Execution backend
# ---------------------------------------------------------------------------
# `clone` (the default) gives each run a disposable `git clone --local` with its
# own `.git`, so the agent can add, commit, stash, branch, and rebase without
# touching your checkout's Git metadata. `worktree` runs in a linked
# `git worktree` instead; it also works, but the agent then needs writes to the
# repository's shared `.git` directory. See docs/execution-backends.md.

[execution]
backend = "clone"
# `native` (the default) runs unattended implement sessions with no approval
# prompts under the provider's own sandbox: Claude in bypassPermissions mode
# with its Bash sandbox on and a hook keeping Edit/Write in the workspace,
# Codex via `codex exec` with a workspace-write profile. `isolated` requires
# backend = "container" (alpha). See docs/execution-backends.md#safety-modes.
safety_mode = "native"
# workspace_root = ".spec-workspaces"

# Network for native sessions. `open` reaches any host except denied_domains;
# `allowlist` reaches only allowed_domains (default: GitHub, the Anthropic API,
# npm, PyPI, Yarn, Azure blobs, localhost). Credential read-denies, not the
# network policy, are the defence against exfiltration; see
# docs/execution-backends.md#network for the risks of open network.
#
# [execution.network]
# mode = "open"
# allowed_domains = ["github.com", "api.github.com", "pypi.org"]
# denied_domains = []

# Send Codex sandbox escalations to its model-based reviewer instead of
# denying them. Off by default.
#
# [execution.codex]
# auto_review = false

# ---------------------------------------------------------------------------
# Coordination (optional)
# ---------------------------------------------------------------------------
# Configure this only when multiple machines share a coordinator. Keep secrets
# such as bearer tokens in `.spec.local.toml` (gitignored by `spec init`) or in
# environment variables, never in committed `.spec.toml`.
#
# [coordination]
# backend = "http"
# url = "http://<coordinator-tailscale-ip>:8765"
# repo_id = "github.com/acme/widget"
# machine_id = "alice-mbp"
