name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  skip-check:
    name: skip-check
    runs-on: ubuntu-latest
    outputs:
      is_version_bump: ${{ steps.check.outputs.is_version_bump }}
    steps:
      - name: Check for version bump PR
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Branch must be release/version-bump from the same repo (not a fork)
          if [ "$HEAD_REF" != "release/version-bump" ] || [ "$HEAD_REPO" != "$REPO" ]; then
            echo "is_version_bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Verify the PR only touches the version field in pyproject.toml
          python3 - <<'PY'
          import json, os, re, sys
          from urllib import request
          from urllib.error import URLError

          repo = os.environ["REPO"]
          pr_number = os.environ["PR_NUMBER"]
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
          }

          url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}/files"
          req = request.Request(url, headers=headers)
          try:
              with request.urlopen(req, timeout=30) as resp:
                  files = json.loads(resp.read().decode())
          except (URLError, OSError, ValueError) as exc:
              print(f"GitHub API request failed ({exc}); defaulting to is_version_bump=false")
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write("is_version_bump=false\n")
              raise SystemExit(0)

          filenames = [f["filename"] for f in files]
          if filenames != ["pyproject.toml"]:
              print(f"Version bump PR touches unexpected files: {filenames}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write("is_version_bump=false\n")
              raise SystemExit(0)

          # Verify the patch only modifies the version line
          patch = files[0].get("patch")
          if patch is None:
              print("GitHub omitted patch text — cannot verify version-only change")
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write("is_version_bump=false\n")
              raise SystemExit(0)
          diff_lines = [
              line for line in patch.splitlines()
              if line.startswith(("+", "-")) and not line.startswith(("+++", "---"))
          ]
          version_re = re.compile(r'^[+-]version\s*=\s*"[^"]*"\s*$')
          non_version = [l for l in diff_lines if not version_re.match(l)]
          if non_version:
              print(f"Version bump PR modifies non-version lines: {non_version}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write("is_version_bump=false\n")
              raise SystemExit(0)

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("is_version_bump=true\n")
          PY

  lint:
    name: lint
    needs: [skip-check]
    if: needs.skip-check.outputs.is_version_bump != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Validate GitHub Actions workflows with actionlint v1.7.12
        env:
          ACTIONLINT_ARCHIVE_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          binary="$RUNNER_TEMP/actionlint"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          test "$($binary -version | head -1)" = "$ACTIONLINT_VERSION"
          "$binary"
      - name: Record successful lint evidence
        run: |
          mkdir -p artifacts/ci-evidence
          python tools/ci_evidence.py record \
            --kind lint \
            --output artifacts/ci-evidence/lint.json
      - name: Upload lint evidence fragment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-lint
          path: artifacts/ci-evidence/lint.json
          if-no-files-found: error
          retention-days: 14

  test:
    name: test
    needs: [skip-check]
    if: needs.skip-check.outputs.is_version_bump != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,tui,web]"
      - name: Run Linux portable suite
        run: |
          mkdir -p artifacts/ci-evidence
          pytest tests/ -v --junitxml 'artifacts/ci-evidence/linux-${{ matrix.python-version }}.xml'
      - name: Record successful Linux matrix evidence
        run: |
          mkdir -p artifacts/ci-evidence
          python tools/ci_evidence.py record \
            --kind linux-test \
            --python-version '${{ matrix.python-version }}' \
            --junit 'artifacts/ci-evidence/linux-${{ matrix.python-version }}.xml' \
            --output 'artifacts/ci-evidence/linux-${{ matrix.python-version }}.json'
      - name: Upload Linux evidence fragment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-linux-${{ matrix.python-version }}
          path: artifacts/ci-evidence/
          if-no-files-found: error
          retention-days: 14

  macos-test:
    name: macos-test
    needs: [skip-check]
    if: needs.skip-check.outputs.is_version_bump != 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,tui,web]"
      - name: Run macOS portable suite
        run: |
          mkdir -p artifacts/ci-evidence
          pytest tests/ -v --junitxml artifacts/ci-evidence/macos-3.12.xml
      - name: Record successful macOS evidence
        run: |
          mkdir -p artifacts/ci-evidence
          python tools/ci_evidence.py record \
            --kind macos-test \
            --python-version 3.12 \
            --junit artifacts/ci-evidence/macos-3.12.xml \
            --output artifacts/ci-evidence/macos-3.12.json
      - name: Upload macOS evidence fragment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-macos-3.12
          path: artifacts/ci-evidence/
          if-no-files-found: error
          retention-days: 14

  package:
    name: package
    needs: [skip-check]
    if: needs.skip-check.outputs.is_version_bump != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install -e ".[dev]"
          python -m build
      - name: Smoke-test wheel and audit dependencies
        run: |
          wheel_path="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          python -m venv "$RUNNER_TEMP/spec-wheel-smoke"
          "$RUNNER_TEMP/spec-wheel-smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/spec-wheel-smoke/bin/python" -m pip install "${wheel_path}[tui,web]" pip-audit
          "$RUNNER_TEMP/spec-wheel-smoke/bin/python" -m pip check
          "$RUNNER_TEMP/spec-wheel-smoke/bin/python" -m pip_audit
          "$RUNNER_TEMP/spec-wheel-smoke/bin/spec" --help >/dev/null
          "$RUNNER_TEMP/spec-wheel-smoke/bin/python" -c "from spec_runtime.web.server import create_app"

  security:
    name: security
    needs: [skip-check]
    if: needs.skip-check.outputs.is_version_bump != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install verified gitleaks v8.29.1
        env:
          GITLEAKS_ARCHIVE_SHA256: e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924
          GITLEAKS_VERSION: 8.29.1
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          binary="$RUNNER_TEMP/gitleaks"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          test "$("$binary" version)" = "$GITLEAKS_VERSION"
      - name: Scan repository history and checked-out tree
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --timeout 120 .
          "$RUNNER_TEMP/gitleaks" dir --config .gitleaks.toml --redact --no-banner --timeout 120 .

  windows-package:
    name: windows-package
    needs: [skip-check]
    if: needs.skip-check.outputs.is_version_bump != 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout with deterministic line endings
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python -m pip install build twine 2>&1 | Tee-Object artifacts/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m build --wheel --sdist 2>&1 | Tee-Object -Append artifacts/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m twine check dist/* 2>&1 | Tee-Object -Append artifacts/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = @(Get-ChildItem dist/*.whl)
          $sdists = @(Get-ChildItem dist/*.tar.gz)
          if ($wheels.Count -ne 1 -or $sdists.Count -ne 1) {
            throw "Expected exactly one wheel and one source distribution"
          }
      - name: Record successful Windows package evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/ci-evidence | Out-Null
          python tools/ci_evidence.py record `
            --kind windows-package `
            --dist-dir dist `
            --output artifacts/ci-evidence/windows-package.json
          exit $LASTEXITCODE
      - name: Upload Windows package evidence fragment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-windows-package
          path: artifacts/ci-evidence/windows-package.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows-built release distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows package logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-package-logs
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  windows-probe:
    name: windows-probe (${{ matrix.python-version }}, ${{ matrix.distribution }})
    needs: [skip-check, windows-package]
    if: >-
      needs.skip-check.outputs.is_version_bump != 'true' &&
      needs.windows-package.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            distribution: wheel
            full_suite: true
            cli_matrix: false
          - python-version: "3.12"
            distribution: wheel
            full_suite: true
            cli_matrix: true
          - python-version: "3.13"
            distribution: wheel
            full_suite: true
            cli_matrix: false
          - python-version: "3.12"
            distribution: sdist
            full_suite: false
            cli_matrix: false
    steps:
      - name: Checkout test suite without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download Windows-built release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release-distributions
          path: release-dist
      - name: Install release distribution with all test surfaces
        shell: pwsh
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $pattern = if ($env:DISTRIBUTION -eq "wheel") { "*.whl" } else { "*.tar.gz" }
          $packages = @(Get-ChildItem (Join-Path "release-dist" $pattern))
          if ($packages.Count -ne 1) {
            throw "Expected exactly one $env:DISTRIBUTION distribution, found $($packages.Count)"
          }
          python -m venv "$env:RUNNER_TEMP/spec-windows-probe"
          $requirement = "$($packages[0].FullName)[dev,web,tui]"
          & "$env:RUNNER_TEMP/spec-windows-probe/Scripts/python.exe" -m pip install $requirement 2>&1 | Tee-Object artifacts/install.log
          exit $LASTEXITCODE
      - name: Check installed dependencies
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/spec-windows-probe/Scripts/python.exe" -m pip check 2>&1 | Tee-Object artifacts/pip-check.log
          exit $LASTEXITCODE
      - name: Probe spec version
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/spec-windows-probe/Scripts/spec.exe" --version 2>&1 | Tee-Object artifacts/spec-version.log
          exit $LASTEXITCODE
      - name: Probe spec help
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/spec-windows-probe/Scripts/spec.exe" --help 2>&1 | Tee-Object artifacts/spec-help.log
          exit $LASTEXITCODE
      - name: Verify imports resolve outside the checkout
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          import spec_runtime

          checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          imported = Path(spec_runtime.__file__).resolve()
          try:
              imported.relative_to(checkout)
          except ValueError:
              print(f"PASS installed artifact: {imported}")
          else:
              raise SystemExit(f"FAIL imported checkout source instead of installed artifact: {imported}")
          '@ | & "$env:RUNNER_TEMP/spec-windows-probe/Scripts/python.exe" - 2>&1 | Tee-Object artifacts/provenance.log
          exit $LASTEXITCODE
      - name: Import every shipped module
        shell: pwsh
        run: |
          @'
          import importlib
          import pkgutil
          import traceback
          import spec_runtime

          modules = [item.name for item in pkgutil.walk_packages(spec_runtime.__path__, spec_runtime.__name__ + ".")]
          failures = []
          for module in modules:
              try:
                  importlib.import_module(module)
                  print(f"PASS {module}")
              except Exception:
                  failures.append(module)
                  print(f"FAIL {module}")
                  traceback.print_exc()
          print(f"Imported {len(modules) - len(failures)}/{len(modules)} modules")
          raise SystemExit(1 if failures else 0)
          '@ | & "$env:RUNNER_TEMP/spec-windows-probe/Scripts/python.exe" - 2>&1 | Tee-Object artifacts/imports.log
          exit $LASTEXITCODE
      - name: Run lint
        if: ${{ matrix.full_suite }}
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/spec-windows-probe/Scripts/python.exe" -m ruff check . 2>&1 | Tee-Object artifacts/lint.log
          exit $LASTEXITCODE
      - name: Run full portable test suite
        if: ${{ matrix.full_suite }}
        shell: pwsh
        run: |
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force artifacts/ci-evidence | Out-Null
          & "$env:RUNNER_TEMP/spec-windows-probe/Scripts/python.exe" -m pytest -o "pythonpath=" tests -v --ignore=tests/test_windows_probe.py --junitxml artifacts/ci-evidence/full-suite.xml 2>&1 | Tee-Object artifacts/full-suite.log
          exit $LASTEXITCODE
      - name: Run Windows integration probes
        if: ${{ matrix.full_suite }}
        shell: pwsh
        run: |
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force artifacts/ci-evidence | Out-Null
          & "$env:RUNNER_TEMP/spec-windows-probe/Scripts/python.exe" -m pytest -o "pythonpath=" tests/test_windows_probe.py -v --junitxml artifacts/ci-evidence/focused.xml 2>&1 | Tee-Object artifacts/focused.log
          exit $LASTEXITCODE
      - name: Run installed-artifact Windows CLI matrix
        if: ${{ matrix.cli_matrix }}
        shell: pwsh
        env:
          SPEC_WINDOWS_INSTALLED_CLI_MATRIX: "1"
        run: |
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force artifacts/ci-evidence | Out-Null
          & "$env:RUNNER_TEMP/spec-windows-probe/Scripts/python.exe" -m pytest -o "pythonpath=" tests/test_windows_probe.py::test_installed_artifact_cli_matrix -vv --junitxml artifacts/ci-evidence/installed-cli-matrix.xml 2>&1 | Tee-Object artifacts/installed-cli-matrix.log
          exit $LASTEXITCODE
      - name: Record successful Windows probe evidence
        shell: pwsh
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          DISTRIBUTION: ${{ matrix.distribution }}
          FULL_SUITE: ${{ matrix.full_suite }}
          CLI_MATRIX: ${{ matrix.cli_matrix }}
        run: |
          New-Item -ItemType Directory -Force artifacts/ci-evidence | Out-Null
          $arguments = @(
            'tools/ci_evidence.py', 'record',
            '--kind', 'windows-probe',
            '--python-version', $env:PYTHON_VERSION,
            '--distribution', $env:DISTRIBUTION,
            '--output', "artifacts/ci-evidence/windows-$env:PYTHON_VERSION-$env:DISTRIBUTION.json"
          )
          if ($env:FULL_SUITE -eq 'true') {
            $arguments += @(
              '--full-suite',
              '--junit', 'artifacts/ci-evidence/full-suite.xml',
              '--focused-junit', 'artifacts/ci-evidence/focused.xml'
            )
          }
          if ($env:CLI_MATRIX -eq 'true') {
            $arguments += @('--cli-matrix', '--cli-junit', 'artifacts/ci-evidence/installed-cli-matrix.xml')
          }
          python @arguments
          exit $LASTEXITCODE
      - name: Upload Windows probe evidence fragment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-windows-${{ matrix.python-version }}-${{ matrix.distribution }}
          path: artifacts/ci-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Summarize Windows gate
        if: ${{ always() }}
        shell: pwsh
        run: |
          @"
          ## Windows product gate

          Python ${{ matrix.python-version }} / ${{ matrix.distribution }}: installation,
          dependency checks, CLI and import smoke tests are required. Wheel jobs also
          require lint, the portable test suite, and native Windows integrations. The
          Python 3.12 wheel additionally runs the installed-artifact end-to-end CLI matrix.
          "@ >> $env:GITHUB_STEP_SUMMARY
      - name: Upload Windows probe logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-probe-${{ matrix.python-version }}-${{ matrix.distribution }}-logs
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  ci-evidence:
    name: ci-evidence
    needs:
      - skip-check
      - lint
      - test
      - macos-test
      - package
      - security
      - windows-package
      - windows-probe
    if: >-
      needs.skip-check.outputs.is_version_bump != 'true' &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.macos-test.result == 'success' &&
      needs.package.result == 'success' &&
      needs.security.result == 'success' &&
      needs.windows-package.result == 'success' &&
      needs.windows-probe.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence contract revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download all CI evidence fragments
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-evidence-*
          path: artifacts/ci-fragments
      - name: Fail-closed aggregation of hosted evidence
        run: |
          revision="$(git rev-parse HEAD)"
          test "$revision" = "$GITHUB_SHA"
          python tools/ci_evidence.py aggregate \
            --input artifacts/ci-fragments \
            --output artifacts/acceptance-evidence \
            --expected-revision "$revision"
      - name: Upload hosted acceptance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-ci-acceptance-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/acceptance-evidence/
          if-no-files-found: error
          retention-days: 14

  ci:
    name: ci
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - skip-check
      - lint
      - test
      - macos-test
      - package
      - security
      - windows-package
      - windows-probe
      - ci-evidence
    steps:
      - name: Enforce required job results
        env:
          IS_VERSION_BUMP: ${{ needs.skip-check.outputs.is_version_bump }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          MACOS_TEST_RESULT: ${{ needs.macos-test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          WINDOWS_PACKAGE_RESULT: ${{ needs.windows-package.result }}
          WINDOWS_RESULT: ${{ needs.windows-probe.result }}
          CI_EVIDENCE_RESULT: ${{ needs.ci-evidence.result }}
        run: |
          echo "is_version_bump=$IS_VERSION_BUMP"
          echo "lint=$LINT_RESULT"
          echo "test=$TEST_RESULT"
          echo "macos-test=$MACOS_TEST_RESULT"
          echo "package=$PACKAGE_RESULT"
          echo "security=$SECURITY_RESULT"
          echo "windows-package=$WINDOWS_PACKAGE_RESULT"
          echo "windows-probe=$WINDOWS_RESULT"
          echo "ci-evidence=$CI_EVIDENCE_RESULT"
          if [ "$IS_VERSION_BUMP" = "true" ]; then
            echo "Version bump PR — skipping product checks."
            exit 0
          fi
          if [ "$LINT_RESULT" != "success" ] || \
             [ "$TEST_RESULT" != "success" ] || \
             [ "$MACOS_TEST_RESULT" != "success" ] || \
             [ "$PACKAGE_RESULT" != "success" ] || \
             [ "$SECURITY_RESULT" != "success" ] || \
             [ "$WINDOWS_PACKAGE_RESULT" != "success" ] || \
             [ "$WINDOWS_RESULT" != "success" ] || \
             [ "$CI_EVIDENCE_RESULT" != "success" ]; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
