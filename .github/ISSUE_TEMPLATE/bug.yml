name: Bug report
description: Something is broken or behaving unexpectedly
labels: ["bug", "triage"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - orchestrator
        - cli
        - forge
        - agent
        - review
        - autopilot
        - web
        - container
        - coordination
        - config
        - packaging
        - docs
        - other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Broken (can't use the tool)
        - Significant (workaround exists)
        - Minor (low impact)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: >
        Describe the bug. Include the exact command you ran and the
        full error output after removing tokens, credentials, private
        repository content, and other sensitive data.
      placeholder: |
        I ran `spec implement --spec my-feature` and got:
        ```
        Error: ...
        ```
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >
        Minimal steps to reproduce. The more specific, the faster the fix.
      placeholder: |
        1. git init a new repo
        2. spec init
        3. spec implement --spec foo
        4. Observe error
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >
        spec version and install channel, Python version, OS, agent CLI
        version, and relevant redacted .spec.toml configuration.
      placeholder: "spec 0.3.0 (tagged pipx install), Python 3.12, macOS 15, claude 1.x"
    validations:
      required: false
