base_ref = "origin/main"

[paths]
specs_dir = "specs"
task_specs_dir = "specs/tasks"
state_dir = ".spec-state"
worktrees_dir = ".worktrees"

[retry]
cap = 20
no_progress_retry_threshold = 2

[agents]
default = "claude"
review_default = "codex"
allowed = ["claude", "codex"]

[bootstrap]
install_command = "python -m venv .venv && .venv/bin/python -m pip install -e '.[dev,tui,web]'"
install_command_windows = "python -m venv .venv; .\\.venv\\Scripts\\python.exe -m pip install -e '.[dev,tui,web]'"
install_shell_windows = "powershell"

[verify]

[[verify.gates]]
name = "test"
command = ".venv/bin/python -m pytest"
argv_windows = [".venv/Scripts/python.exe", "-m", "pytest"]
parallel = true

[[verify.gates]]
name = "lint"
command = ".venv/bin/python -m ruff check ."
argv_windows = [".venv/Scripts/python.exe", "-m", "ruff", "check", "."]
parallel = true
